[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivitals"
version = "0.1.0"
description = "AI architecture check for AI projects: layer audit, bug-prone pattern scan, claim-vs-code verification. 100% local."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "aivitals contributors"}]
keywords = ["ai", "architecture", "audit", "static-analysis", "mcp"]
dependencies = ["pyyaml>=6"]

[project.scripts]
aivitals = "aivitals.cli:main"

[project.urls]
Homepage = "https://github.com/cunzailv/aivitals"

[tool.setuptools.packages.find]
include = ["aivitals*"]

[tool.setuptools.package-data]
aivitals = ["../checks/*.yaml"]
