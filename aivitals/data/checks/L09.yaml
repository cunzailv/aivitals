yaml_version: 0.1
as_of: 2026-11-27
checks:
- id: L09-P0-008
  layer: 9
  group: B
  title: 造一个万能工具
  severity: P0
  kind: defect
  detect:
    all_of:
    - type: regex_any
      globs:
      - '**/*.py'
      - '**/*.ts'
      pattern: (run_shell|execute_sql|exec_command|shell_exec|run_bash)
      max_hits: 3
    - type: none
      globs:
      - '**/*.py'
      - '**/*.ts'
      pattern: allowlist|allowed_tools|whitelist|sandbox|approval
  fix: 工具按动作拆细，参数白名单 + 审批 + 沙箱；不要给 Agent 一个能碰全系统的入口。
  impact: shell + SQL + 发邮件打包给 Agent，等于给它 root。
  derived_from: L9/pits/1
  maturity_gate: internal
  as_of: '2026-11-27'
  applies_to:
  - ai_native_app
  - ai_enabled_app
